<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Browser command fixture</title></head>
<body>
  <form id="form">
    <label for="name">Name</label>
    <input id="name" value="seed">
    <button type="submit">Apply</button>
  </form>
  <output id="result" data-submits="0">untouched</output>
  <script>
    document.getElementById('form').addEventListener('submit', event => {
      event.preventDefault();
      const result = document.getElementById('result');
      result.dataset.submits = String(Number(result.dataset.submits) + 1);
      document.getElementById('result').textContent = document.getElementById('name').value;
    });
  </script>
</body>
</html>
