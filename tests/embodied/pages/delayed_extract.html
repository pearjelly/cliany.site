<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Delayed extract fixture</title></head>
<body>
  <button type="button" id="show">Show result</button>
  <script>
    document.getElementById('show').addEventListener('click', () => {
      const output = document.createElement('output');
      output.id = 'dynamic-result';
      output.textContent = 'ready';
      document.body.appendChild(output);
    });
  </script>
</body>
</html>
