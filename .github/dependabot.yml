version: 2
updates:
  # 监控 Python 依赖：browser-use、langchain-*、以及项目内其他 pip 包
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"

  # 监控 GitHub Actions；统一合并为一个可审阅的升级提案，避免 action major 漂移。
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci(deps)"
